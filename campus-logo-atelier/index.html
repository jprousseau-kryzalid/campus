<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus — Atelier couleurs du logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2035;--cream:#FAF8F5;--line:rgba(43,32,53,.12);--muted:#6E6578}
*{box-sizing:border-box}
body{margin:0;background:#F2EFEA;color:var(--ink);font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;background:rgba(242,239,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:0 auto;padding:16px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;letter-spacing:-.02em;margin:0 12px 0 0;white-space:nowrap}
.models{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
.model{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px 8px 10px;cursor:pointer;display:flex;gap:9px;align-items:center;white-space:nowrap;color:var(--ink);flex:none}
.model svg{width:26px;height:26px}
.model:hover{border-color:rgba(43,32,53,.35)}
.model.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.model .plus{width:26px;height:26px;border-radius:50%;background:conic-gradient(#F8532F,#FFC83D,#A8D134,#4CB6DA,#9D8BEF,#FA738B,#F8532F);display:block}
.custom{max-width:1320px;margin:0 auto;padding:0 28px 16px;display:none;gap:24px;flex-wrap:wrap;align-items:flex-end}
.custom.open{display:flex}
.slot{min-width:250px}
.slot-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.slot-h span{font-weight:600;color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace}
.sw{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.sw button{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;padding:0;outline-offset:2px}
.sw button.on{outline:2px solid var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.btn:hover{background:#F6F3FF}
.btn.dark{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.toast{font-size:12px;color:var(--muted)}
main{max-width:1320px;margin:0 auto;padding:24px 28px 64px;display:flex;flex-direction:column;gap:20px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:#fff;border-radius:22px;overflow:hidden;border:1px solid rgba(43,32,53,.06);display:flex;flex-direction:column;min-width:0}
.st{flex:1;display:grid;place-items:center;padding:28px;min-height:220px}
.cap{font-size:12px;font-weight:700;color:var(--muted);padding:12px 18px;border-top:1px solid rgba(43,32,53,.06);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cream{background:var(--cream)}.ink{background:var(--ink)}.tint{background:#EEEAFD}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c4{grid-column:span 4}
.hero .st{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.hero svg{width:min(620px,80%);height:auto}
.tag{font-weight:800;font-size:28px;letter-spacing:-.02em}
.sym{width:150px;height:auto}
.icon{width:132px;height:132px;border-radius:32px;background:var(--ink);display:grid;place-items:center}.icon svg{width:80px}
.sizes{display:flex;gap:28px;align-items:flex-end}.sizes div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:600}
.inkLogo{min-height:300px}.inkLogo svg{width:min(500px,72%);height:auto}
.anim svg{width:190px;overflow:visible}
.animsel{display:flex;gap:6px;flex-wrap:wrap}
.sectionh{display:flex;justify-content:space-between;align-items:baseline}.sectionh h2{margin:0;font-size:18px;letter-spacing:-.02em}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pin{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;align-items:center}
.pin:hover{border-color:var(--ink)}.pin svg{width:64px}.pin b{font-size:12px;text-align:center}
.pin .x{position:absolute;top:6px;right:8px;border:none;background:none;font-size:16px;cursor:pointer;color:var(--muted)}
.pin .hex{font-size:10px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;text-align:center}
.empty{font-size:13px;color:var(--muted)}
@media (max-width:1000px){.c8,.c4{grid-column:span 12}}
</style>
</head>

const MODELS=[{name:'Actuel',c:{top:'#F8532F',left:'#9D8BEF',bottom:'#A8D134'}},{name:'V1 — Corail déplacé',c:{top:'#9D8BEF',left:'#A8D134',bottom:'#F8532F'}},{name:'V2 — Lilas, ciel, lime',c:{top:'#9D8BEF',left:'#4CB6DA',bottom:'#A8D134'}},{name:'V3 — Lilas, ciel, orange',c:{top:'#9D8BEF',left:'#4CB6DA',bottom:'#FD6644'}},{name:'V4 — Orange, lilas clair, jaune',c:{top:'#FD6644',left:'#B9ADF5',bottom:'#FFC83D'}}];
const SLOTS=[['top','Haut'],['left','Gauche'],['bottom','Bas']];
let custom={...MODELS[0].c};try{const s=JSON.parse(localStorage.getItem('campus-custom')||'null');if(s&&s.top)custom=s;}catch(e){}
const saveCustom=()=>{try{localStorage.setItem('campus-custom',JSON.stringify(custom));}catch(e){}};
let sel=0;const CU=()=>MODELS.length;
const cur=()=>sel===CU()?custom:MODELS[sel].c;
const nameOf=h=>(PAL.find(p=>p[1]===h)||['?'])[0];
const textCol=h=>({'#A8D134':'#86AE1E','#C8E66A':'#86AE1E','#B9ADF5':'#8B79E6','#FFC83D':'#C99400','#4CB6DA':'#2F9CC2'}[h]||h);
const NSS='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id);
function symbolSVG(c,attr){return `<svg ${attr||''} viewBox="-2 -2 199 209" xmlns="${NSS}"><path transform="translate(${PIECES[0].ox} ${PIECES[0].oy})" d="${PIECES[0].d}" fill="${c.bottom}"/><path transform="translate(${PIECES[1].ox} ${PIECES[1].oy})" d="${PIECES[1].d}" fill="${c.left}"/><path transform="translate(${PIECES[2].ox} ${PIECES[2].oy})" d="${PIECES[2].d}" fill="${c.top}"/></svg>`;}
function logoSVG(c,word){const a=LOGO.arcs;return `<svg viewBox="-4 -4 ${LOGO.w+8} ${LOGO.h+8}" xmlns="${NSS}"><path transform="translate(${a.bottom.x} ${a.bottom.y})" d="${a.bottom.d}" fill="${c.bottom}"/><path transform="translate(${a.left.x} ${a.left.y})" d="${a.left.d}" fill="${c.left}"/><path transform="translate(${a.top.x} ${a.top.y})" d="${a.top.d}" fill="${c.top}"/>`+LOGO.word.map(w=>`<path transform="translate(${w.x} ${w.y})" d="${w.d}" fill="${word}"/>`).join('')+`</svg>`;}
function buildModels(){
  $('models').innerHTML=MODELS.map((m,i)=>`<button class="model${sel===i?' on':''}" data-i="${i}" title="${m.name}">${symbolSVG(m.c)}${m.name.split(' — ')[0]}</button>`).join('')+`<button class="model${sel===CU()?' on':''}" data-i="${CU()}">${sel===CU()?symbolSVG(custom):'<i class="plus"></i>'}Perso</button>`;
  $('models').querySelectorAll('.model').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;if(sel===CU())customName=null;render();});}
function buildSlots(){const c=custom;
  $('slots').innerHTML=SLOTS.map(([k,l])=>`<div class="slot"><div class="slot-h">${l} <span>${nameOf(c[k])} ${c[k]}</span></div><div class="sw" data-k="${k}">${PAL.map(([n,h])=>`<button title="${n} ${h}" aria-label="${l} : ${n}" data-h="${h}" class="${h===c[k]?'on':''}" style="background:${h}"></button>`).join('')}</div></div>`).join('');
  $('slots').querySelectorAll('.sw').forEach(sw=>sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{custom[sw.dataset.k]=b.dataset.h;customName=null;saveCustom();render();}));}
function render(){const c=cur();buildModels();$('custom').classList.toggle('open',sel===CU());if(sel===CU())buildSlots();
  const nm=sel===CU()?(customName||'Couleurs perso'):MODELS[sel].name;$('curName').textContent=nm;$('heroName').textContent=sel===CU()?(customName||'Couleurs perso'):MODELS[sel].name;
  $('hero').innerHTML=logoSVG(c,'#2B2035')+`<div class="tag"><span style="color:${textCol(c.top)}">Learn.</span> <span style="color:${textCol(c.left)}">Connect.</span> <span style="color:${textCol(c.bottom)}">Do.</span></div>`;
  $('symCream').innerHTML=symbolSVG(c,'class="sym"');$('symInk').innerHTML=symbolSVG(c,'class="sym"');
  $('appIcon').innerHTML=`<div class="icon">${symbolSVG(c)}</div>`;
  $('logoInk').innerHTML=logoSVG(c,'#FAF8F5');
  $('sizes').innerHTML=`<div class="sizes">${[64,32,16].map(s=>`<div><div style="width:${s}px">${symbolSVG(c,'style="width:100%;display:block"')}</div>${s} px</div>`).join('')}</div>`;
  if(parts){parts[0].grp.setAttribute('fill',c.bottom);parts[1].grp.setAttribute('fill',c.left);parts[2].grp.setAttribute('fill',c.top);}}
/* animation */
let parts=null,animT=0,animKey='spinner';
const ANIMS=[['spinner','01 Spinner'],['spinres','01 B'],['pour','02 Coulée'],['loader','03 Chargement']];
function buildAnimSel(){$('animSel').innerHTML=ANIMS.map(([k,l])=>`<button class="btn${k===animKey?' dark':''}" data-k="${k}">${l}</button>`).join('');$('animSel').querySelectorAll('button').forEach(b=>b.onclick=()=>{animKey=b.dataset.k;animT=0;buildAnimSel();});}
function animInit(){const svg=document.createElementNS(NSS,'svg');svg.setAttribute('viewBox','-12 -12 220 229');const g=document.createElementNS(NSS,'g');svg.appendChild(g);$('anim').appendChild(svg);
  parts=PIECES.map(p=>{const grp=document.createElementNS(NSS,'g');const main=document.createElementNS(NSS,'path');let ext=null;if(p.ext){ext=document.createElementNS(NSS,'path');grp.appendChild(ext);}grp.appendChild(main);g.appendChild(grp);return {grp,main,ext};});}
function animDraw(t){const an=A[animKey];PIECES.forEach((p,i)=>{const st=state(an,i,t);parts[i].main.setAttribute('d',shape(p.ring,p,st,p.cap));if(p.ext)parts[i].ext.setAttribute('d',shape(p.extRing,p,st,p.extCap));parts[i].grp.setAttribute('opacity',st.o==null?1:st.o);});}
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;animT+=dt;if(animT>A[animKey].dur+1.6)animT=0;animDraw(Math.min(animT,A[animKey].dur));requestAnimationFrame(loop);}
const toast=m=>{['toast','toast2'].forEach(id=>$(id).textContent=m);clearTimeout(toast.t);toast.t=setTimeout(()=>['toast','toast2'].forEach(id=>$(id).textContent=''),2400);};
$('replay').onclick=()=>{animT=0;};
$('rot').onclick=()=>{const c=custom;custom={top:c.bottom,left:c.top,bottom:c.left};saveCustom();render();};
$('swapLR').onclick=()=>{const c=custom;custom={top:c.top,left:c.bottom,bottom:c.left};saveCustom();render();};
$('copy').onclick=async()=>{const c=custom;const s=`Haut ${nameOf(c.top)} ${c.top} · Gauche ${nameOf(c.left)} ${c.left} · Bas ${nameOf(c.bottom)} ${c.bottom}`;try{await navigator.clipboard.writeText(s);toast('Copié.');}catch(e){toast(s);}};
let customName=null;
let pins=[];try{pins=JSON.parse(localStorage.getItem('campus-pins')||'[]');}catch(e){}
const savePins=()=>{try{localStorage.setItem('campus-pins',JSON.stringify(pins));}catch(e){}};
function renderPins(){if(!pins.length){$('pins').innerHTML='<p class="empty">Épinglez un modèle ou vos couleurs perso pour les garder ici. Cliquez une version épinglée pour la recharger.</p>';return;}
  $('pins').innerHTML=pins.map((p,i)=>`<div class="pin" data-i="${i}"><button class="x" data-x="${i}" aria-label="Retirer">×</button>${symbolSVG(p.c)}<b>${p.name}</b><span class="hex">${p.c.top} · ${p.c.left} · ${p.c.bottom}</span></div>`).join('');
  $('pins').querySelectorAll('.pin').forEach(el=>el.onclick=e=>{if(e.target.dataset.x!=null){pins.splice(+e.target.dataset.x,1);savePins();renderPins();return;}const p=pins[+el.dataset.i];custom={...p.c};customName=p.name;saveCustom();sel=CU();render();window.scrollTo({top:0,behavior:'smooth'});});}
$('pinBtn').onclick=()=>{const isC=sel===CU();const n=isC?(customName||`Perso ${pins.filter(p=>p.name.startsWith('Perso')).length+1}`):MODELS[sel].name;pins.push({name:n,c:{...cur()}});savePins();renderPins();toast('Version épinglée.');};
$('clearPins').onclick=()=>{pins=[];savePins();renderPins();};
buildAnimSel();animInit();render();renderPins();requestAnimationFrame(loop);
</script>
</body>
</html>
